<aside class="sidebar" [class.sidebar--collapsed]="collapsed">
  <div class="sidebar__brand">
    <div class="sidebar__logo">AI</div>
    @if (!collapsed) {
      <div class="sidebar__titles">
        <span class="sidebar__name">Agro Inventario</span>
        <span class="sidebar__tag">Inventario inteligente</span>
      </div>
    }
  </div>

  <nav class="sidebar__nav" aria-label="Navegación principal">
    @for (group of groups(); track group.id) {
      <div class="sidebar__group">
        @if (!collapsed) {
          <p class="sidebar__section">{{ group.label }}</p>
        }
        <mat-nav-list>
          @for (item of group.items; track item.route) {
            <a
              mat-list-item
              [routerLink]="item.route"
              routerLinkActive="is-active"
              [title]="item.label"
              (click)="navigate.emit()"
            >
              <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
              @if (!collapsed) {
                <span matListItemTitle>{{ item.label }}</span>
              }
            </a>
          }
        </mat-nav-list>
      </div>
    }
  </nav>

  @if (!collapsed) {
    <footer class="sidebar__footer">Agropecuario · Bucaramanga</footer>
  }
</aside>
