<h2 mat-dialog-title>{{ isEdit ? 'Editar categoría' : 'Nueva categoría' }}</h2>

<mat-dialog-content>
  @if (errorMessage(); as message) {
    <div class="form-error" role="alert">
      <mat-icon>error_outline</mat-icon>
      <span>{{ message }}</span>
    </div>
  }

  <form class="categoria-form" [formGroup]="form" (ngSubmit)="submit()" id="categoria-form">
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" maxlength="100" />
      @if (form.controls.nombre.hasError('required') && form.controls.nombre.touched) {
        <mat-error>El nombre es obligatorio</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Descripción</mat-label>
      <textarea matInput formControlName="descripcion" rows="3" maxlength="500"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="undefined" [disabled]="loading()">
    Cancelar
  </button>
  <button
    mat-flat-button
    color="primary"
    type="submit"
    form="categoria-form"
    [disabled]="loading()"
  >
    @if (loading()) {
      <mat-spinner diameter="20" />
    } @else {
      {{ isEdit ? 'Guardar cambios' : 'Crear categoría' }}
    }
  </button>
</mat-dialog-actions>
