# Perfil de desarrollo local
spring:
  sql:
    init:
      mode: always
      data-locations: classpath:data-dev.sql
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.agroinventario: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
