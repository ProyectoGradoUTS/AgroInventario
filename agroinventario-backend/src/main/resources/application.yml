# =============================================================================
# Agro Inventario API - Configuración base
# =============================================================================
# Las credenciales sensibles se leen desde variables de entorno.
# =============================================================================

spring:
  application:
    name: agro-inventario-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agroinventario}
    username: ${DB_USERNAME:agro_user}
    password: ${DB_PASSWORD:agro_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AgroInventarioHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: America/Bogota
    defer-datasource-initialization: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:tu_correo@gmail.com}
    password: ${MAIL_PASSWORD:tu_password_de_aplicacion}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  name: Agro Inventario API
  version: 0.0.1-SNAPSHOT

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

  jwt:
    secret: AgroInventarioSecretKeyParaDesarrolloLocalMinimo256Bits1234567890
    expiration-ms: 86400000

  alertas:
    dias-anticipacion-vencimiento: ${ALERTAS_DIAS_ANTICIPACION:30}
    cron-vencimiento: ${ALERTAS_CRON_VENCIMIENTO:0 0 6 * * *}
    email-destino: ${ALERTAS_EMAIL_DESTINO:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false

logging:
  level:
    root: INFO
    com.agroinventario: DEBUG
    org.hibernate.SQL: ${JPA_SHOW_SQL:false}
    org.springframework.security: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"