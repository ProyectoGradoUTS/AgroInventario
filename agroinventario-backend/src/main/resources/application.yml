# =============================================================================
# Agro Inventario API - Configuración base
# =============================================================================
# Las credenciales sensibles se leen desde variables de entorno.
# Ver .env.example para la lista completa.

spring:
  application:
    name: agro-inventario-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agroinventario}
    username: ${DB_USERNAME:agro_user}
    password: ${DB_PASSWORD:agro_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AgroInventarioHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: America/Bogota
    defer-datasource-initialization: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  name: Agro Inventario API
  version: 0.0.1-SNAPSHOT
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:AgroInventarioSecretKeyParaDesarrolloLocalMinimo256Bits1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root: INFO
    com.agroinventario: DEBUG
    org.hibernate.SQL: ${JPA_SHOW_SQL:false}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
